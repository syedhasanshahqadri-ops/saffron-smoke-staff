<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Panel | Saffron & Smoke</title>
<script>document.documentElement.dataset.theme=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body>
<header class="top"><span class="logo">Saffron <b>&amp;</b> Smoke staff</span><nav><button class="sb" id="snd">Sound on</button><button class="ib" id="th" aria-label="Switch light or dark theme">◐</button><button class="btn sm" id="out" hidden>Sign out</button></nav></header>
<section id="login" class="lg"><h1>Staff sign in</h1><form id="lf"><label>Email<input id="em" type="email" required autocomplete="username"></label><label>Password<input id="pw" type="password" required autocomplete="current-password"></label><button class="btn">Sign in</button><p class="err" id="le" role="alert"></p></form></section>
<main id="dash" hidden><div class="stats" id="st"></div>
<div class="tools"><select id="fs" aria-label="Filter by status"><option value="">All statuses</option><option>New</option><option>Preparing</option><option>Ready</option><option>Delivered</option><option>Cancelled</option></select>
<select id="ft" aria-label="Filter by order type"><option value="">All order types</option><option>Dine-in</option><option>Home Delivery</option><option>Takeaway</option></select>
<input id="fq" placeholder="Search by order ID, name, mobile or table"></div>
<p class="err" id="msg"></p><div id="list"></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script><script src="js/app.js"></script></body></html>
